name: Build and Push API Image

on:
  push:
    branches:
      - main
    paths:
      - 'MovieTracker.Api/**'
      - '.github/workflows/acr-build-push.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: movie-tracker-aca-deploy
  cancel-in-progress: false

env:
  ACR_NAME: movietracker
  IMAGE_NAME: movie-tracker-api
  AZURE_RESOURCE_GROUP: RG-MovieTracker-Demo
  CONTAINER_APP_NAME: movie-tracker-api

jobs:
  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Image Tag From Run Number And Short SHA
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE_TAG=${{ github.run_number }}-$SHORT_SHA" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push Image to ACR
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:$IMAGE_TAG \
            --file MovieTracker.Api/Dockerfile \
            --build-arg IMAGE_TAG=$IMAGE_TAG \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            MovieTracker.Api

      - name: Update Container App To New Image Tag
        run: |
          az containerapp update \
            -n ${{ env.CONTAINER_APP_NAME }} \
            -g ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:$IMAGE_TAG

      - name: Purge Old ACR Image Tags Keeping Last Two
        run: |
          az acr run \
            --registry ${{ env.ACR_NAME }} \
            --cmd "acr purge --filter '${{ env.IMAGE_NAME }}:.*' --ago 0d --keep 2 --untagged" \
            /dev/null
